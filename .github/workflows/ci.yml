name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npx expo-doctor
        working-directory: apps/mobile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
